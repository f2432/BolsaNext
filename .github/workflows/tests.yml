name: tests

on:
  push:
    branches: ["main", "dev", "integration/v0.3"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            artifact-suffix: linux-py312
          - os: windows-latest
            python-version: "3.14"
            artifact-suffix: windows-py314
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Record installed dependency versions
        run: python -m pip list --format=freeze

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Run tests with coverage
        run: |
          python -m pytest -q --cov=src/bolsa --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.artifact-suffix }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14
