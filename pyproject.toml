[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bolsanext"
dynamic = ["version"]
description = "Plataforma pessoal de análise de investimentos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "pandas>=2.2",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "yfinance>=0.2.40",
    "platformdirs>=4",
    # pandas.read_html() uses lxml to parse Wikipedia universe tables.
    "lxml>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9,<1",
]
# Future analysis/AI dependencies; not required to run the V0.2 app.
analysis = [
    "numpy>=1.26",
    "scikit-learn>=1.6",
    "matplotlib>=3.8",
    "PyYAML>=6",
]

[project.scripts]
bolsanext = "bolsa.main:main"
bolsanext-migrate-data = "bolsa.tools.migrate_data_dir:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "bolsa.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
