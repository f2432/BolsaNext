[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bolsanext"
dynamic = ["version"]
description = "Plataforma pessoal de análise de investimentos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6",
    "pandas",
    "numpy",
    "SQLAlchemy",
    "alembic",
    "yfinance",
    "platformdirs",
    "scikit-learn",
    "matplotlib",
    "PyYAML",
    "lxml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
bolsanext = "bolsa.main:main"
bolsanext-migrate-data = "bolsa.tools.migrate_data_dir:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "bolsa.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
